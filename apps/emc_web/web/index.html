<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- "/" for local `jaspr serve`. The deploy workflow rewrites it to the
         Pages path ("/<repo>/"); the router and relative asset URLs follow it.
         Keep this exact line: the workflow matches it. -->

    <base href="/">

    <!-- No <title> here: each route sets it (jaspr_router appends its own
         <title>, and the browser would otherwise keep the first one). -->
    <meta name="description" content="EMC Portal: tools for the Extra Mural Class admin.">
    <link rel="icon" href="assets/brand/emc-logo.svg" type="image/svg+xml">

    <!-- Design tokens first: every other stylesheet uses them. -->
    <link rel="stylesheet" href="styles/tokens.css">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/reminders.css">

    <script defer src="main.client.dart.js"></script>
  </head>
  <body>
    <noscript>EMC Portal needs JavaScript to load the timetable.</noscript>
  </body>
</html>
