name: emc_web
description: EMC Portal website (Jaspr, client mode, static hosting on GitHub Pages).
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.0

resolution: workspace

dependencies:
  emc_core:
    path: ../../packages/emc_core
  http: ^1.6.0
  jaspr: ^0.23.5
  jaspr_router: ^0.9.0

dev_dependencies:
  build_runner: ^2.15.1
  build_web_compilers: ^4.8.5
  jaspr_builder: ^0.23.5
  lints: ^6.1.0
  test: ^1.26.0

jaspr:
  mode: client
  # Required for client mode. We don't use @css; styles live in web/styles/.
  styles: standalone
